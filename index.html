    if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);
  const beep = useCallback((freq=880, dur=0.15, vol=0.4) => {
    try {
      const ctx = init();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur);
    } catch(e){}
  }, [init]);
  const done = useCallback(() => {
    try {
      const ctx = init();
      [[0,880],[0.2,1047],[0.4,1319]].forEach(([t,f]) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.5, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.4);
        osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.45);
      });
    } catch(e){}
  }, [init]);
  const warning = useCallback(() => {
    try {
      const ctx = init();
      [0, 0.15, 0.3].forEach(t => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.3, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
        osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.25);
      });
    } catch(e){}
  }, [init]);
  return { init, beep, done, warning };
}

function RestTimer({ seconds, total, onSkip, accent, audio }) {
  const pct = Math.max(0, (seconds / total) * 100);
  const isWarning = seconds <= 10;
  useEffect(() => {
    if (seconds === 10 || seconds === 5 || seconds === 3 || seconds === 2 || seconds === 1) {
      audio.beep(isWarning ? 1047 : 880, 0.12, 0.4);
    }
  }, [seconds]);
  return (
    <div className="slide-up" style={{position:'fixed',bottom:0,left:0,right:0,zIndex:90,background:isWarning?'#450a0a':'#1e293b',borderTop:`2px solid ${isWarning?'#dc2626':accent}`,padding:'16px 20px',borderRadius:'16px 16px 0 0'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <button onClick={onSkip} style={{background:'#334155',border:'none',borderRadius:8,padding:'8px 14px',color:'#94a3b8',fontSize:12,cursor:'pointer'}}>تخطي الراحة</button>
        <div style={{textAlign:'center'}}>
          <div style={{color:isWarning?'#ef4444':'#64748b',fontSize:11,fontWeight:700}}>⏳ وقت الراحة</div>
          <div style={{color:isWarning?'#ef4444':'#f8fafc',fontSize:36,fontWeight:800}}>{Math.floor(seconds/60)}:{String(seconds%60).padStart(2,'0')}</div>
        </div>
      </div>
      <div style={{background:'#0f172a',borderRadius:99,height:6,overflow:'hidden'}}>
        <div style={{background:isWarning?'#dc2626':accent,height:6,width:`${pct}%`,transition:'width 1s linear',borderRadius:99}}/>
      </div>
    </div>
  );
}

function WorkoutTimer({ elapsed, maxSeconds, audio }) {
  const remaining = Math.max(0, maxSeconds - elapsed);
  const isOver = elapsed > maxSeconds;
  const isWarning = remaining <= 300 && remaining > 0;
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  const remMins = Math.floor(remaining / 60);
  const remSecs = remaining % 60;
  useEffect(() => { if (remaining === 300) audio.warning(); }, [remaining]);
  return (
    <div style={{background:isOver?'#450a0a':isWarning?'#7c2d12':'#1e293b',borderRadius:12,padding:'10px 14px',border:`1px solid ${isOver?'#dc2626':isWarning?'#f97316':'#334155'}`,display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <div style={{textAlign:'left'}}>
        <div style={{color:isOver?'#ef4444':isWarning?'#f97316':'#64748b',fontSize:10,fontWeight:700}}>{isOver ? '⚠️ تجاوزت 45 دقيقة' : isWarning ? '⏰ اقترب الوقت' : '⏱ الوقت المتبقي'}</div>
        <div style={{color:isOver?'#ef4444':'#f8fafc',fontSize:18,fontWeight:800}}>{isOver ? `+${mins-45}:${String(secs).padStart(2,'0')}` : `${remMins}:${String(remSecs).padStart(2,'0')}`}</div>
      </div>
      <div style={{textAlign:'right'}}>
        <div style={{color:'#64748b',fontSize:10}}>المنقضي</div>
        <div style={{color:'#f8fafc',fontSize:18,fontWeight:800}}>{mins}:{String(secs).padStart(2,'0')}</div>
      </div>
    </div>
  );
}

function WorkoutScreen({ dayPlan, onFinish, onBack }) {
  const c = PLAN_COLORS[dayPlan.id] || { bg: '#1e293b', accent: '#3b82f6', emoji: '💪' };
  const audio = useAudio();
  const [audioActivated, setAudioActivated] = useState(false);
  const buildExercises = useCallback(() => {
    return dayPlan.exercises.map(name => {
      const db = EXERCISE_DB[name];
      if (!db) return null;
      return { ...db, name, setsData: Array.from({ length: db.sets }, () => ({ weight: '', reps: '', rir: db.rir, done: false })) };
    }).filter(Boolean);
  }, [dayPlan]);
  const [exercises, setExercises] = useState(buildExercises);
  const [activeEx, setActiveEx] = useState(0);
  const [editingSet, setEditingSet] = useState(null);
  const [showDetail, setShowDetail] = useState(null);
  const [rest, setRest] = useState({ active: false, seconds: 75, total: 75 });
  const [restConfig, setRestConfig] = useState(75);
  const [workoutElapsed, setWorkoutElapsed] = useState(0);
  const [workoutStarted, setWorkoutStarted] = useState(false);
  const startTimeRef = useRef(null);

  useEffect(() => {
    if (!workoutStarted) return;
    const iv = setInterval(() => { setWorkoutElapsed(Math.floor((Date.now() - startTimeRef.current) / 1000)); }, 1000);
    return () => clearInterval(iv);
  }, [workoutStarted]);

  useEffect(() => {
    if (!rest.active) return;
    const iv = setInterval(() => {
      setRest(r => { if (r.seconds <= 1) { audio.done(); return { ...r, active: false, seconds: 0 }; } return { ...r, seconds: r.seconds - 1 }; });
    }, 1000);
    return () => clearInterval(iv);
  }, [rest.active]);

  const startWorkout = () => { audio.init(); setAudioActivated(true); setWorkoutStarted(true); startTimeRef.current = Date.now(); };

  const updateSet = (ei, si, field, val) => {
    setExercises(prev => prev.map((ex, i) => i !== ei ? ex : { ...ex, setsData: ex.setsData.map((s, j) => j !== si ? s : { ...s, [field]: val }) }));
  };

  const completeSet = (ei, si) => {
    audio.init();
    setExercises(prev => prev.map((ex, i) => i !== ei ? ex : { ...ex, setsData: ex.setsData.map((s, j) => j !== si ? s : { ...s, done: true }) }));
    setRest({ active: true, seconds: restConfig, total: restConfig });
    setEditingSet(null);
  };

  const undoSet = (ei, si) => {
    setExercises(prev => prev.map((ex, i) => i !== ei ? ex : { ...ex, setsData: ex.setsData.map((s, j) => j !== si ? s : { ...s, done: false }) }));
  };

  const skipRest = () => { setRest({ active: false, seconds: 0, total: restConfig }); };

  const handleFinish = () => {
    const session = {
      date: new Date().toISOString().split('T')[0], timestamp: Date.now(),
      workoutName: dayPlan.name, workoutId: dayPlan.id, planType: dayPlan.planType,
      durationSeconds: workoutElapsed,
      exercises: exercises.map(ex => ({ name: ex.name, setsData: ex.setsData })),
    };
    const history = LS.get(KEYS.history, []);
    history.push(session);
    LS.set(KEYS.history, history);
    onFinish(session);
  };

  const totalSets = exercises.reduce((a, ex) => a + ex.setsData.length, 0);
  const doneSets = exercises.reduce((a, ex) => a + ex.setsData.filter(s => s.done).length, 0);
  const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
  const currentEx = exercises[activeEx];
  const nextEx = exercises[activeEx + 1];

  if (!workoutStarted) {
    return (
      <div className="fade-in" style={{ minHeight: '100vh', background: '#0a0f1a', padding: '0 0 40px' }}>
        <style>{ANIM_STYLE}</style>
        <div style={{ background: c.bg, padding: '20px 16px 16px', borderBottom: `2px solid ${c.accent}33` }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <button onClick={onBack} style={{ background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: 8, padding: '7px 11px', color: '#e2e8f0', cursor: 'pointer', fontSize: 15 }}>→</button>
            <div style={{ textAlign: 'right' }}>
              <div style={{ color: c.accent, fontSize: 11 }}>{c.emoji} {dayPlan.name}</div>
              <div style={{ color: '#f8fafc', fontWeight: 800, fontSize: 18 }}>تجهيز التمرين</div>
            </div>
          </div>
        </div>
        <div style={{ padding: '16px' }}>
          <div style={{ background: '#1e293b', borderRadius: 16, padding: 16, marginBottom: 16, border: '1px solid #334155' }}>
            <div style={{ color: '#f8fafc', fontWeight: 700, fontSize: 14, marginBottom: 12 }}>📋 تمارين اليوم ({exercises.length} تمارين)</div>
            {exercises.map((ex, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: i < exercises.length - 1 ? '1px solid #334155' : 'none', flexDirection: 'row-reverse' }}>
                <span style={{ color: '#e2e8f0', fontSize: 13 }}>{ex.name}</span>
                <span style={{ color: c.accent, fontSize: 12, fontWeight: 600 }}>{ex.sets} × {ex.repsMin}-{ex.repsMax}</span>
              </div>
            ))}
          </div>
          <div style={{ background: '#1e293b', borderRadius: 16, padding: 16, marginBottom: 16, border: '1px solid #334155' }}>
            <div style={{ color: '#f8fafc', fontWeight: 700, fontSize: 14, marginBottom: 8 }}>⏱ إعدادات</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ color: '#94a3b8', fontSize: 12 }}>وقت الراحة بين المجموعات:</span>
              <select value={restConfig} onChange={e => setRestConfig(parseInt(e.target.value))} style={{ background: '#0f172a', border: '1px solid #334155', borderRadius: 8, padding: '6px 10px', color: '#f8fafc', fontSize: 13 }}>
                {REST_OPTIONS.map(o => <option key={o} value={o}>{o}s</option>)}
              </select>
            </div>
            <div style={{ color: '#64748b', fontSize: 11 }}>الهدف: إكمال التمرين في 45 دقيقة كحد أقصى</div>
          </div>
          <button onClick={startWorkout} style={{ width: '100%', background: `linear-gradient(135deg,${c.accent},#22c55e)`, border: 'none', borderRadius: 14, padding: '18px', color: '#fff', fontSize: 18, fontWeight: 800, cursor: 'pointer' }}>🚀 ابدأ التمرين</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', background: '#0a0f1a', padding: '0 0 120px' }}>
      <style>{ANIM_STYLE}</style>
      <div style={{ background: c.bg, padding: '14px 16px 12px', borderBottom: `2px solid ${c.accent}33`, position: 'sticky', top: 0, zIndex: 50 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <button onClick={onBack} style={{ background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: 8, padding: '7px 11px', color: '#e2e8f0', cursor: 'pointer', fontSize: 15 }}>→</button>
          <div style={{ textAlign: 'right', flex: 1, paddingRight: 10 }}>
            <div style={{ color: c.accent, fontSize: 11 }}>{c.emoji} {dayPlan.name}</div>
            <div style={{ color: '#f8fafc', fontWeight: 800, fontSize: 16 }}>{pct}% مكتمل</div>
          </div>
          <div style={{ textAlign: 'left' }}>
            <div style={{ color: '#f8fafc', fontWeight: 800, fontSize: 20 }}>{doneSets}/{totalSets}</div>
            <div style={{ color: '#64748b', fontSize: 10 }}>مجموعة</div>
          </div>
        </div>
        <WorkoutTimer elapsed={workoutElapsed} maxSeconds={MAX_DURATION} audio={audio} />
        <div style={{ background: 'rgba(255,255,255,0.1)', borderRadius: 99, height: 4, overflow: 'hidden' }}>
          <div style={{ background: c.accent, height: 4, width: `${pct}%`, transition: 'width 0.4s', borderRadius: 99 }} />
        </div>
        <div style={{ display: 'flex', gap: 6, marginTop: 10, overflowX: 'auto', paddingBottom: 2, flexDirection: 'row-reverse' }}>
          {exercises.map((ex, i) => {
            const done = ex.setsData.every(s => s.done);
            return (
              <button key={i} onClick={() => setActiveEx(i)}
                style={{ background: i === activeEx ? c.accent : done ? `${c.accent}22` : 'rgba(255,255,255,0.07)', border: 'none', borderRadius: 20, padding: '5px 11px', color: i === activeEx ? '#fff' : done ? c.accent : '#94a3b8', cursor: 'pointer', fontSize: 11, whiteSpace: 'nowrap', fontWeight: 600, flexShrink: 0 }}>
                {done ? '✓ ' : ''}{ex.name}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ padding: '14px 16px' }}>
        {currentEx && (
          <div style={{ background: '#1e293b', borderRadius: 18, padding: 16, border: `1px solid ${c.accent}22`, marginBottom: 12 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12, flexDirection: 'row-reverse' }}>
              <div style={{ flex: 1 }}>
                <h2 style={{ color: '#f8fafc', fontSize: 16, fontWeight: 700, margin: '0 0 4px' }}>{currentEx.name}</h2>
                <div style={{ color: c.accent, fontSize: 11, fontWeight: 600 }}>{currentEx.sets} × {currentEx.repsMin}-{currentEx.repsMax} | RIR {currentEx.rir} | Rest {currentEx.restSeconds}s</div>
              </div>
              <button onClick={() => setShowDetail(currentEx)} style={{ background: `${c.accent}22`, border: `1px solid ${c.accent}44`, borderRadius: 10, padding: '8px 12px', color: c.accent, cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>ℹ️ التفاصيل</button>
            </div>

            <div style={{ background: '#0f172a', borderRadius: 12, padding: '12px 8px', marginBottom: 14, border: `1px solid ${c.accent}22`, display: 'flex', justifyContent: 'center' }}>
              <ExerciseAnim name={currentEx.name} accent={c.accent} />
            </div>

            {nextEx && activeEx < exercises.length - 1 && (
              <div style={{ background: `${c.accent}11`, borderRadius: 8, padding: '6px 10px', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ color: '#64748b', fontSize: 10 }}>التالي:</span>
                <span style={{ color: c.accent, fontSize: 11, fontWeight: 600 }}>{nextEx.name}</span>
              </div>
            )}

            {currentEx.setsData.map((set, si) => (
              <div key={si} style={{ background: set.done ? `${c.accent}11` : '#0f172a', borderRadius: 12, padding: 12, marginBottom: 8, border: `1px solid ${set.done ? c.accent + '44' : '#1e293b'}` }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexDirection: 'row-reverse', marginBottom: 10 }}>
                  <span style={{ color: set.done ? c.accent : '#475569', fontWeight: 700, fontSize: 12 }}>المجموعة {si + 1}</span>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    {set.done && (
                      <button onClick={() => undoSet(activeEx, si)} style={{ background: 'transparent', border: '1px solid #334155', borderRadius: 6, padding: '4px 8px', color: '#94a3b8', cursor: 'pointer', fontSize: 10 }}>↩️ تراجع</button>
                    )}
                    <button onClick={() => set.done ? undoSet(activeEx, si) : setEditingSet({ exIdx: activeEx, setIdx: si })}
                      style={{ background: set.done ? c.accent : 'transparent', border: `2px solid ${set.done ? c.accent : '#334155'}`, borderRadius: 99, width: 26, height: 26, cursor: 'pointer', color: set.done ? '#fff' : '#64748b', fontSize: 12, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      {set.done ? '✓' : '○'}
                    </button>
                  </div>
                </div>

                {editingSet && editingSet.exIdx === activeEx && editingSet.setIdx === si && !set.done ? (
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 10 }}>
                    <div>
                      <div style={{ color: '#475569', fontSize: 9, marginBottom: 4, textAlign: 'center' }}>الوزن (kg)</div>
                      <input type="number" step="0.5" value={set.weight} onChange={e => updateSet(activeEx, si, 'weight', e.target.value)} placeholder="0" style={{ width: '100%', background: '#1e293b', border: '1px solid #334155', borderRadius: 8, padding: '8px 6px', color: '#f8fafc', fontSize: 16, fontWeight: 700, textAlign: 'center', outline: 'none' }} />
                    </div>
                    <div>
                      <div style={{ color: '#475569', fontSize: 9, marginBottom: 4, textAlign: 'center' }}>التكرار</div>
                      <input type="number" value={set.reps} onChange={e => updateSet(activeEx, si, 'reps', e.target.value)} placeholder="0" style={{ width: '100%', background: '#1e293b', border: '1px solid #334155', borderRadius: 8, padding: '8px 6px', color: '#f8fafc', fontSize: 16, fontWeight: 700, textAlign: 'center', outline: 'none' }} />
                    </div>
                    <div>
                      <div style={{ color: '#475569', fontSize: 9, marginBottom: 4, textAlign: 'center' }}>RIR</div>
                      <select value={set.rir} onChange={e => updateSet(activeEx, si, 'rir', e.target.value)} style={{ width: '100%', background: '#1e293b', border: '1px solid #334155', borderRadius: 8, padding: '8px 4px', color: '#f8fafc', fontSize: 14, fontWeight: 700, textAlign: 'center', outline: 'none' }}>
                        <option>0</option><option>1</option><option>1-2</option><option>2</option><option>2-3</option><option>3</option>
                      </select>
                    </div>
                  </div>
                ) : set.done ? (
                  <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
                    <span style={{ color: '#94a3b8', fontSize: 13 }}>{set.weight || '—'} kg × {set.reps || '—'} rep</span>
                    <span style={{ color: c.accent, fontSize: 13, fontWeight: 600 }}>RIR {set.rir}</span>
                  </div>
                ) : (
                  <div style={{ color: '#64748b', fontSize: 11, textAlign: 'center' }}>اضغط على الدائرة لإدخال البيانات</div>
                )}

                {editingSet && editingSet.exIdx === activeEx && editingSet.setIdx === si && !set.done && (
                  <button onClick={() => completeSet(activeEx, si)} style={{ width: '100%', background: c.accent, border: 'none', borderRadius: 10, padding: '12px', color: '#fff', fontSize: 15, fontWeight: 800, cursor: 'pointer', marginTop: 8 }}>
                    ✅ أكمل المجموعة
                  </button>
                )}
              </div>
            ))}
          </div>
        )}

        <div style={{ display: 'flex', gap: 10 }}>
          {activeEx < exercises.length - 1 ? (
            <button onClick={() => setActiveEx(activeEx + 1)} style={{ flex: 1, background: c.accent, border: 'none', borderRadius: 12, padding: 12, color: '#fff', fontWeight: 700, cursor: 'pointer', fontSize: 14 }}>التالي ←</button>
          ) : (
            <button onClick={handleFinish} style={{ flex: 1, background: `linear-gradient(135deg,${c.accent},#22c55e)`, border: 'none', borderRadius: 12, padding: 12, color: '#fff', fontWeight: 700, cursor: 'pointer', fontSize: 14 }}>🏁 إنهاء التمرين</button>
          )}
          {activeEx > 0 && <button onClick={() => setActiveEx(activeEx - 1)} style={{ flex: 1, background: '#1e293b', border: '1px solid #334155', borderRadius: 12, padding: 12, color: '#94a3b8', cursor: 'pointer', fontSize: 14 }}>← السابق</button>}
        </div>
      </div>

      {rest.active && <RestTimer seconds={rest.seconds} total={rest.total} onSkip={skipRest} accent={c.accent} audio={audio} />}
      {showDetail && <ExerciseDetailModal exercise={showDetail} accent={c.accent} onClose={() => setShowDetail(null)} />}
    </div>
  );
}

function HistoryScreen({ onBack }) {

function ProgressScreen({ onBack }) {
  const history = LS.get(KEYS.history, []);
  const exerciseStats = useMemo(() => {
    const stats = {};
    history.forEach(session => {
      session.exercises.forEach(ex => {
        if (!stats[ex.name]) stats[ex.name] = { sessions: 0, bestWeight: 0, lastWeight: 0, bestReps: 0, lastReps: 0, totalSets: 0 };
        stats[ex.name].sessions++;
        ex.setsData.forEach(set => {
          if (set.done) {
            const w = parseFloat(set.weight) || 0;
            const r = parseInt(set.reps) || 0;
            stats[ex.name].totalSets++;
            if (w > stats[ex.name].bestWeight) stats[ex.name].bestWeight = w;
            if (r > stats[ex.name].bestReps) stats[ex.name].bestReps = r;
            stats[ex.name].lastWeight = w;
            stats[ex.name].lastReps = r;
          }
        });
      });
    });
    return stats;
  }, [history]);

  return (
    <div className="fade-in" style={{ minHeight: '100vh', background: '#0a0f1a', padding: '0 0 80px' }}>
      <div style={{ background: '#1e293b', padding: '16px', borderBottom: '1px solid #334155', position: 'sticky', top: 0, zIndex: 50 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <button onClick={onBack} style={{ background: 'transparent', border: 'none', color: '#94a3b8', cursor: 'pointer', fontSize: 15 }}>→</button>
          <h1 style={{ color: '#f8fafc', fontSize: 16, fontWeight: 800, margin: 0 }}>📈 تقدم التمارين</h1>
        </div>
      </div>
      <div style={{ padding: '16px' }}>
        {Object.keys(exerciseStats).length === 0 ? (
          <div style={{ textAlign: 'center', padding: '60px 20px', color: '#475569' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>📊</div>
            <div style={{ fontSize: 14 }}>لا توجد بيانات كافية</div>
            <div style={{ fontSize: 12, marginTop: 4 }}>سجل بعض التدريبات أولاً</div>
          </div>
        ) : (
          Object.entries(exerciseStats).map(([name, stats]) => (
            <div key={name} style={{ background: '#1e293b', borderRadius: 12, padding: 14, marginBottom: 10, border: '1px solid #334155' }}>
              <div style={{ color: '#f8fafc', fontWeight: 700, fontSize: 14, marginBottom: 8 }}>{name}</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 6 }}>
                <div style={{ background: '#0f172a', borderRadius: 8, padding: 8, textAlign: 'center' }}>
                  <div style={{ color: '#64748b', fontSize: 9 }}>الجلسات</div>
                  <div style={{ color: '#3b82f6', fontWeight: 700, fontSize: 14 }}>{stats.sessions}</div>
                </div>
                <div style={{ background: '#0f172a', borderRadius: 8, padding: 8, textAlign: 'center' }}>
                  <div style={{ color: '#64748b', fontSize: 9 }}>أفضل وزن</div>
                  <div style={{ color: '#22c55e', fontWeight: 700, fontSize: 14 }}>{stats.bestWeight || '—'}</div>
                </div>
                <div style={{ background: '#0f172a', borderRadius: 8, padding: 8, textAlign: 'center' }}>
                  <div style={{ color: '#64748b', fontSize: 9 }}>آخر وزن</div>
                  <div style={{ color: '#f8fafc', fontWeight: 700, fontSize: 14 }}>{stats.lastWeight || '—'}</div>
                </div>
                <div style={{ background: '#0f172a', borderRadius: 8, padding: 8, textAlign: 'center' }}>
                  <div style={{ color: '#64748b', fontSize: 9 }}>المجموعات</div>
                  <div style={{ color: '#a855f7', fontWeight: 700, fontSize: 14 }}>{stats.totalSets}</div>
                </div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function MetricsScreen({ onBack }) {
  const [metrics, setMetrics] = useState(LS.get(KEYS.metrics, []));

  const addMetric = () => {
    if (!form.weight && !form.bodyFat) return;
    const newMetrics = [...metrics, { ...form, timestamp: Date.now() }];
    setMetrics(newMetrics);
    LS.set(KEYS.metrics, newMetrics);
    setShowForm(false);
    setForm({ weight: '', bodyFat: '', skeletalMuscle: '', waist: '', date: new Date().toISOString().split('T')[0] });
  };

  const sorted = [...metrics].sort((a, b) => b.timestamp - a.timestamp);

      <div style={{ background: '#1e293b', padding: '16px', borderBottom: '1px solid #334155', position: 'sticky', top: 0, zIndex: 50 }}>

        {showForm && (
          <div style={{ background: '#1e293b', borderRadius: 12, padding: 14, marginBottom: 12, border: '1px solid #334155' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 10 }}>
              <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} style={{ background: '#0f172a', border: '1px solid #334155', borderRadius: 8, padding: '8px', color: '#f8fafc', fontSize: 12 }} />

              <input type="number" step="0.1" value={form.skeletalMuscle} onChange={e => setForm({ ...form, skeletalMuscle: e.target.value })} placeholder="عضلات (kg)" style={{ background: '#0f172a', border: '1px solid #334155', borderRadius: 8, padding: '8px', color: '#f8fafc', fontSize: 12 }} />

                        </div>

                  )}
                  {m.waist && (
                    <div style={{ background: '#0f172a', borderRadius: 8, padding: 8, textAlign: 'center' }}>

      {screen === 'metrics' && <MetricsScreen onBack={() => setScreen('home')} />}
      {screen === 'settings' && <SettingsScreen onBack={() => setScreen('home')} planType={planType} setPlanType={setPlanType} />}

      {screen !== 'workout' && screen !== 'summary' && (
        <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: '#1e293b', borderTop: '1px solid #334155', display: 'flex', justifyContent: 'space-around', padding: '8px 0', zIndex: 100 }}>
          <button onClick={() => setScreen('home')} style={{ background: 'transparent', border: 'none', color: screen === 'home' ? '#3b82f6' : '#64748b', cursor: 'pointer', fontSize: 11, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
            <span style={{ fontSize: 18 }}>🏠</span><span>الرئيسية</span>
          </button>
          <button onClick={() => setScreen('history')} style={{ background: 'transparent', border: 'none', color: screen === 'history' ? '#3b82f6' : '#64748b', cursor: 'pointer', fontSize: 11, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
            <span style={{ fontSize: 18 }}>📊</span><span>السجل</span>
          </button>
          <button onClick={() => setScreen('progress')} style={{ background: 'transparent', border: 'none', color: screen === 'progress' ? '#3b82f6' : '#64748b', cursor: 'pointer', fontSize: 11, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
            <span style={{ fontSize: 18 }}>📈</span><span>التقدم</span>
          </button>
          <button onClick={() => setScreen('metrics')} style={{ background: 'transparent', border: 'none', color: screen === 'metrics' ? '#3b82f6' : '#64748b', cursor: 'pointer', fontSize: 11, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
            <span style={{ fontSize: 18 }}>📏</span><span>القياسات</span>
          </button>
          <button onClick={() => setScreen('settings')} style={{ background: 'transparent', border: 'none', color: screen === 'settings' ? '#3b82f6' : '#64748b', cursor: 'pointer', fontSize: 11, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
            <span style={{ fontSize: 18 }}>⚙️</span><span>الإعدادات</span>
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
